[project]
name = "kloc-agent"
version = "0.1.0"
description = "Self-hosted research-agent service over kloc-intelligence MCP"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Backend foundation (dev-1)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    # SQLAlchemy async needs greenlet to bridge sync DB calls onto the loop.
    # Not a transitive of sqlalchemy[asyncio]; without it every async DB call
    # raises ValueError on first use (caught by QA).
    "greenlet>=3.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "aioboto3>=13.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    # Runner + Strands stack (dev-2 bundled change-request).
    # B-INFRA-6: `[anthropic]` extras pull the `anthropic` SDK client
    # that `strands.models.anthropic.AnthropicModel` imports at module
    # load. Operator Gemini pivot: `[gemini]` extras pull `google-genai`
    # for `strands.models.gemini.GeminiModel`. Both kept — runner-side
    # `model_factory` chooses by the `LLM_PROVIDER` env at spawn.
    "strands-agents[anthropic,gemini]==1.39.0",
    "ag-ui-protocol==0.1.18",
    "ag_ui_strands==0.1.8",
    "strands_agentskills @ git+https://github.com/aws-samples/sample-strands-agents-agentskills@c5564fcd2e7c249ec57b32027ffbea49e9abeb7b",
    "aiodocker>=0.26",
    "mcp>=1.2,<2",
    # OTel auto-instrumentation (dev-3 batch — Track H)
    # Version-unpinned per OTel auto-instrument convention; pin if uv lock fails.
    "opentelemetry-distro[otlp]",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-instrumentation-asyncpg",
    "opentelemetry-instrumentation-logging",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# strands_agentskills is installed from a git+https URL (R1 mitigation, not on
# PyPI). Hatch refuses direct references unless this flag is set.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: pure Python, no IO, no network",
    "integration: real Postgres + backend HTTP; runner + LLM mocked",
    "e2e: full compose + real Anthropic + real Docker runner",
    "slow: takes > 30s; usually e2e",
]
addopts = "-ra --strict-markers -m 'not e2e'"
