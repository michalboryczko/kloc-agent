services:

  postgres:
    image: quay.io/tembo/pg16-pgmq:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kloc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-kloc_agent}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [kloc]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kloc} -d ${POSTGRES_DB:-kloc_agent}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio-data:/data
    networks: [kloc]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  mc-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-kloc-agent-artifacts-dev}
    entrypoint: >
      /bin/sh -c "
      set -e;
      /usr/bin/mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      /usr/bin/mc mb --ignore-existing local/$$ARTIFACT_BUCKET;
      /usr/bin/mc anonymous set none local/$$ARTIFACT_BUCKET;
      echo 'mc-init done';
      "
    restart: on-failure
    networks: [kloc]

  skills-init:
    # Seeds the `kloc-skills` named volume with the repo-root `./skills/`
    # tree on first boot. Runners then mount the named volume read-only
    # via aiodocker — the bind-from-compose vs aiodocker path-resolution
    # mismatch goes away because the named volume is Docker-managed.
    image: alpine:3.20
    volumes:
      - ./skills:/source:ro
      - kloc-skills:/dest
    entrypoint: >
      /bin/sh -c "
      set -e;
      cp -R /source/. /dest/;
      echo 'skills-init done';
      "
    restart: "no"
    networks: [kloc]

  backend-migrate:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kloc}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-kloc_agent}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [kloc]
    restart: "no"

  backend:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kloc}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-kloc_agent}
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_USE_SSL: "false"
      ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-kloc-agent-artifacts-dev}
      RUNNER_WARM_IDLE_S: ${RUNNER_WARM_IDLE_S:-300}
      RUNNER_HEARTBEAT_TIMEOUT_S: ${RUNNER_HEARTBEAT_TIMEOUT_S:-30}
      RUNNER_IMAGE_TAG: ${RUNNER_IMAGE_TAG:-kloc-agent-runner:dev}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BACKEND_URL: http://backend:8000
      KLOC_HOOK_SECRET: ${KLOC_HOOK_SECRET:-dev-secret-please-rotate}
      KLOC_DENY_TOOLS: ${KLOC_DENY_TOOLS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-kloc-agent}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-console}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-console}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-console}
      KLOC_MCP_URL: ${KLOC_MCP_URL:-http://host.docker.internal:8765/mcp}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8000"
    volumes:
      # Docker-outside-of-Docker (sibling-container pattern). The backend
      # manages per-session runner containers on the host daemon via
      # aiodocker → DockerRunner. The socket bind-mount is mandatory; without
      # it lifespan fails loudly at boot.
      - /var/run/docker.sock:/var/run/docker.sock
      - kloc-hydration:/tmp/kloc-hydration
      - kloc-skills:/skills-source:ro
    networks: [kloc]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
      mc-init:
        condition: service_completed_successfully
      skills-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined into the client bundle at `next build`
        # — must be a build ARG, not just runtime env.
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8002
        NEXT_PUBLIC_COPILOTKIT_AGENT_NAME: kloc_agent
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8002
      COPILOTKIT_AGENT_NAME: kloc_agent
      NEXT_TELEMETRY_DISABLED: "1"
    networks: [kloc]
    depends_on:
      backend:
        condition: service_healthy

networks:
  kloc:
    name: kloc

volumes:
  postgres-data:
  minio-data:
  kloc-hydration:
    name: kloc-hydration
  kloc-skills:
    name: kloc-skills
